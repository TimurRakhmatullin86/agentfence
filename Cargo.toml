[package]
name = "agentfence"
version = "0.1.0"
edition = "2021"
authors = ["Timur Rakhmatullin <timur.rakhmatullin86@gmail.com>"]
description = "Business governance layer for AI agents — budget limits, approval rules, RBAC, and audit trail"
license = "Apache-2.0"
repository = "https://github.com/TimurRakhmatullin86/agentfence"
homepage = "https://github.com/TimurRakhmatullin86/agentfence"
keywords = ["ai", "agents", "governance", "policy", "mcp"]
categories = ["command-line-utilities", "config"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
glob = "0.3"
colored = "2.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["full"] }
tokio-process = "0.2"
