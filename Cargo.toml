[package]
name = "agentfence"
version = "0.2.0"
edition = "2021"
authors = ["Timur Rakhmatullin <timur.rakhmatullin86@gmail.com>"]
description = "Rulebook for AI agents — default-deny policies, SQL-aware enforcement, budget limits, and MCP proxy"
license = "Apache-2.0"
repository = "https://github.com/TimurRakhmatullin86/agentfence"
homepage = "https://github.com/TimurRakhmatullin86/agentfence"
keywords = ["ai", "agents", "governance", "policy", "mcp"]
categories = ["command-line-utilities", "config"]
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
glob = "0.3"
colored = "2.0"
sha2 = "0.10"
regex = "1.10"
sqlparser = "0.53"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1.0", features = ["full"] }
