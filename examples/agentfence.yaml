# agentfence proxy config
# Place this as agentfence.yaml in your project root

# Path to policy file or directory
policy: .agentfence

# Agent name for policy matching
default_agent: my-agent

# Audit log file (optional)
log_file: agentfence-audit.jsonl

# Downstream MCP servers to proxy
servers:
  - name: filesystem
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp/workspace"]

